site_name: Garmin Nuvi Documentation
site_description: Garmin Nuvi Map and Navigation Update Guide
site_author: Garmin Nuvi

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Installation: installation.md
  - Activation: activation.md
  - FAQ: faq.md
  - Map Update Guide: map-update-guide.md
  - Software Update: software-update.md
  - Garmin Nuvi Articles:
      - Garmin Nuvi 1300 Update: Articles/garmin-1300-nuvi-update.md
      - Garmin Nuvi 1450 Update: Articles/garmin-nuvi-1450-update.md
      - Garmin Nuvi Navigation Update: Articles/garmin-nuvi-navigation-update.md
      - Garmin Nuvi Software Update: Articles/garmin-nuvi-software-update.md

extra_css:
  - stylesheets/style.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - fenced_code